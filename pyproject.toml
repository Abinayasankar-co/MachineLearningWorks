[project]
name = "machinelearningworks"
version = "0.1.0"
description = "PDM-managed machine learning workspace for retailer product identification and crop classification."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "MachineLearningWorks" },
]
dependencies = [
    "torch",
    "torchvision",
    "pandas",
    "numpy",
    "tqdm",
    "scikit-learn",
    "seaborn",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
check-env = "python scripts/check_pdm_env.py"
pdm-manager = "python scripts/retailer_mlw_pdm.py"
jupyter = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser"
devcontainer = { cmd = "docker build -t machinelearningworks:pdm -f Dockerfile ." }
